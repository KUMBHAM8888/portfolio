name: Deploy portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate HTML
        run: npx --yes html-validate@8 index.html
      - name: Check JavaScript syntax
        run: |
          node --check assets/js/data.js
          node --check assets/js/app.js
      - name: Check required files exist
        run: |
          for f in index.html assets/css/style.css assets/js/data.js assets/js/app.js assets/photo.jpg assets/Sai_Teja_K_Resume.pdf; do
            test -f "$f" || { echo "Missing $f"; exit 1; }
          done

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
